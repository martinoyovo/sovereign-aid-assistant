# Settings of the video tutorials of margin (Ondaclip).
# Format: https://ondaclip.com/docs/configuration/ . Change it by pull request,
# or from the studio (it opens the pull request). Never put a secret here:
# demo accounts stay in Secret Manager.
version: 1
locales:
  - en-US
appEnvironment: dev
devGuard:
  envKey: TUTO_BASE_ENV
  appHostPattern: "^github\\.com$"
apiPattern: /api/
safeEmail: "@example\\.com$"
signedOutPattern: /login
voice: { project: ondaclipapp }
agent:
  harness: agy
cloud:
  appUrl: https://github.com/martinoyovo/sovereign-aid-assistant
  project: ondaclipapp
publish:
  targets: { dev: gs://ondaclipapp-ondaclip-cloud/margin }
freshness:
  manifest: gs://ondaclipapp-ondaclip-cloud/margin/manifest.json
products:
  app:
    name: margin
    tutorials: tutorials
    publication: publication.yaml
signInForm:
  path: /login
  email: martinosoyen@gmail.com
  password: theone
  submit: theone
